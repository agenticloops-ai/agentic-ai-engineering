[project]
name = "lesson-sandboxing"
version = "0.1.0"
description = "Lesson: Sandboxing - Isolate agent-run code with resource limits"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0.0",
    "common",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[tool.uv.sources]
common = { path = "../../common", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
