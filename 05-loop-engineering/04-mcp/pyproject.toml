[project]
name = "lesson-mcp"
version = "0.1.0"
description = "Lesson: MCP Integration - Discover tools from MCP servers and publish your own"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0.0",
    "common",
    "mcp>=2.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[tool.uv.sources]
common = { path = "../../common", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
