[project]
name = "lesson-loop-mcp"
version = "0.1.0"
description = "Lesson 4: MCP Integration - discover tools from Model Context Protocol servers"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "common",
    "mcp>=1.8.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=14.0.0",
]

[tool.uv.sources]
common = { path = "../../common", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
