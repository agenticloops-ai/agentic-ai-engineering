[project]
name = "lesson-extensible-agent"
version = "0.1.0"
description = "Lesson: Extensible Agent - Skills, hooks, sandbox, MCP, subagents, and compaction combined"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0.0",
    "common",
    "mcp>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
]

[tool.uv.sources]
common = { path = "../../common", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
